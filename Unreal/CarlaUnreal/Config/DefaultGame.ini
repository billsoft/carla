; 5.8 Content 的 BP_TLOpenDrive_v02 自身蓝图编译错误（ST_TrafficLightProps 数组连到静态网格体对象数组，资产未重存），
; 上面常驻 cook TrafficLight 目录会把它带进来，导致整个打包失败（Error_UnknownCookFailure）。它没有被任何代码/地图需要，
; 用 NeverCook 单独排除。必须 bIsEditorOnly=True：非编辑器类型会在保存时检查 GetPrimaryAssetId()，普通 Actor 蓝图
; 返回空 ID 会报 "does not match object's real id" 错误（AlwaysCook 精确列名的做法因此不可行，2026-10-14 实测）。
+PrimaryAssetTypesToScan=(PrimaryAssetType="CarlaNeverCook",AssetBaseClass="/Script/Engine.Actor",bHasBlueprintClasses=True,bIsEditorOnly=True,SpecificAssets=("/Game/Carla/Blueprints/TrafficLight/BP_TLOpenDrive_v02.BP_TLOpenDrive_v02"),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=False,CookRule=NeverCook))

