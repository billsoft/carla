<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Viewer V2</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 使用 CDN 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <!-- 左侧: 图像预览 (2列4行 或者 4列2行) -->
        <div id="image-panel">
            <div class="camera-grid">
                <!-- 8个相机位 -->
                <div class="cam-box"><img id="cam_0" src="" alt="Front Main"><div class="cam-label">Front Main</div></div>
                <div class="cam-box"><img id="cam_1" src="" alt="Front Wide"><div class="cam-label">Front Wide</div></div>
                <div class="cam-box"><img id="cam_2" src="" alt="Front Narrow"><div class="cam-label">Front Narrow</div></div>
                <div class="cam-box"><img id="cam_7" src="" alt="Rear"><div class="cam-label">Rear</div></div>
                
                <div class="cam-box"><img id="cam_3" src="" alt="Left Pillar"><div class="cam-label">Left Pillar</div></div>
                <div class="cam-box"><img id="cam_4" src="" alt="Right Pillar"><div class="cam-label">Right Pillar</div></div>
                <div class="cam-box"><img id="cam_5" src="" alt="Left Repeater"><div class="cam-label">Left Repeater</div></div>
                <div class="cam-box"><img id="cam_6" src="" alt="Right Repeater"><div class="cam-label">Right Repeater</div></div>
            </div>
            
            <div id="voxel-list-container" style="margin-top: 20px;">
                <h3>Voxel Statistics</h3>
                <div id="voxel-list"></div>
            </div>
        </div>

        <!-- 中间: 3D Viewer -->
        <div id="viewer-panel">
            <div id="three-container"></div>
            <div id="loading-overlay">Loading...</div>
        </div>

        <!-- 右侧: 控制面板 -->
        <div id="control-panel">
            <h2>Controls</h2>
            
            <div class="control-group">
                <label>Dataset Path:</label>
                <input type="text" id="dataset-path" value="d:\code\carla\dataset_10k_bak">
                <button id="load-dataset-btn">Load</button>
            </div>

            <div class="control-group">
                <div class="playback-controls">
                    <button id="prev-btn">⏮</button>
                    <button id="play-btn">▶</button>
                    <button id="next-btn">⏭</button>
                </div>
                <div class="slider-container">
                    <input type="range" id="frame-slider" min="0" max="100" value="0">
                    <span id="frame-counter">0 / 0</span>
                </div>
                <div class="speed-control">
                    <label>Speed (ms):</label>
                    <input type="number" id="speed-input" value="500" step="100" min="100">
                </div>
            </div>

            <div class="control-group">
                <h3>Frame Info</h3>
                <div id="frame-name">ID: -</div>
                <div id="voxel-stats">Voxels: 0</div>
            </div>

            <div class="control-group">
                <h3>Legend</h3>
                <div id="legend"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/viewer.js"></script>
</body>
</html>
