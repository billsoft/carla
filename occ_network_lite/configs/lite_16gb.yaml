# Lite 配置 - 针对 16GB 显存优化
# 适用场景: RTX 3080/3090/4070Ti 等 16GB 显存 GPU

# ========== 数据配置 ==========
data:
  batch_size: 1              # 16GB 显存安全配置
  num_workers: 4             # 数据加载线程
  img_size: [256, 448]       # 降低分辨率 (原 384×640)
  grid_size: [100, 100, 8]   # BEV 网格尺寸 (降采样)

# ========== 模型配置 ==========
model:
  num_cameras: 8
  backbone: mobilenetv2      # 轻量级 backbone (3.4M vs ResNet50 25M)
  embed_dim: 128             # 降低特征维度 (原 256)
  num_heads: 4               # 降低注意力头数 (原 8)
  num_transformer_layers: 2  # 减少层数 (原 6)
  bev_h: 100                 # BEV 高度
  bev_w: 100                 # BEV 宽度
  num_classes: 18            # nuScenes 18 类
  num_heights: 8             # Z 方向层数 (原 16)

# ========== 训练配置 ==========
train:
  epochs: 24                 # 总训练轮数
  lr: 2e-4                   # 学习率
  weight_decay: 0.01         # 权重衰减

  # 显存优化技巧
  amp: true                  # 混合精度训练 (节省 ~40% 显存)
  grad_clip: 35.0            # 梯度裁剪
  accumulate_grad: 4         # 梯度累积 (模拟 batch_size=4)

  # 检查点
  save_interval: 2           # 每 2 个 epoch 保存
  val_interval: 1            # 每 1 个 epoch 验证
  log_interval: 20           # 每 20 步打印日志

# ========== 损失函数 ==========
loss:
  ce_weight: 0.7             # 交叉熵权重
  lovasz_weight: 0.3         # Lovasz 损失权重

# ========== 优化器 ==========
optimizer:
  type: adamw
  betas: [0.9, 0.999]
  eps: 1e-8

# ========== 学习率调度 ==========
scheduler:
  type: cosine               # 余弦退火
  warmup_epochs: 1           # 预热轮数
  min_lr: 1e-6               # 最小学习率

# ========== 预期性能 ==========
# 显存占用: ~6-8 GB (batch_size=1, AMP)
# 训练速度: ~8-12 秒/步 (RTX 3080)
# 参数量: ~15M
# mIoU (100帧训练): 0.25-0.35
