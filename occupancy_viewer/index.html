<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CARLA Occupancy 体素可视化查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 320px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        #viewer {
            flex: 1;
            position: relative;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #0f3460;
            background: linear-gradient(90deg, #0f3460, #533483);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .section {
            margin-bottom: 20px;
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e94560;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #e94560;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        button:hover {
            background: #c23650;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        #frameList {
            max-height: 250px;
            overflow-y: auto;
            background: #1a1a2e;
            border-radius: 5px;
            padding: 5px;
        }

        .frame-item {
            padding: 8px;
            margin: 3px 0;
            background: #16213e;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .frame-item:hover {
            background: #0f3460;
            transform: translateX(5px);
        }

        .frame-item.active {
            background: #e94560;
            color: white;
        }

        #stats {
            font-size: 11px;
            line-height: 1.8;
        }

        #stats div {
            padding: 4px;
            border-left: 3px solid #e94560;
            padding-left: 10px;
            margin: 5px 0;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            padding: 4px;
            background: #1a1a2e;
            border-radius: 3px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #e94560;
            background: rgba(22, 33, 62, 0.9);
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .info {
            font-size: 10px;
            color: #999;
            margin-top: 8px;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>🚗 Occupancy 查看器</h1>

            <div class="section">
                <div class="section-title">📂 数据集加载</div>
                <div class="file-input-wrapper">
                    <button>选择文件夹 (occupancy)</button>
                    <input type="file" id="folderInput" webkitdirectory directory multiple>
                </div>
                
                <div style="margin-top: 10px;">
                    <label style="font-size: 12px; color: #aaa;">默认网格尺寸 (当无元数据时):</label>
                    <select id="gridProfile" style="width: 100%; margin-top: 5px; background: #1a1a2e; color: white; border: 1px solid #0f3460; padding: 5px; border-radius: 4px;">
                        <option value="512" selected>512 x 512 x 40 (0.2m) - nuScenes标准</option>
                        <option value="500">500 x 500 x 40 (0.2m) - 旧版数据集</option>
                        <option value="200">200 x 200 x 16 (0.5m) - 网络训练</option>
                    </select>
                </div>

                <div class="info">选择包含 .npz 文件的 occupancy 文件夹</div>
            </div>

            <div class="section">
                <div class="section-title">▶ 播放控制</div>
                <button id="playBtn" style="background: #27ae60;">▶ 自动播放</button>
                <div style="margin-top: 10px;">
                    <label style="font-size: 12px; color: #aaa;">播放速度: <span id="speedValue">1000ms</span></label>
                    <input type="range" id="speedSlider" min="100" max="3000" value="1000" step="100"
                           style="width: 100%; margin-top: 5px; accent-color: #27ae60;">
                </div>
                <div class="info" style="margin-top: 8px;">提示: 播放时不显示加载提示</div>
            </div>

            <div class="section">
                <div class="section-title">📷 视图控制</div>
                <div class="controls">
                    <button onclick="viewer.setView('top')">俯视图</button>
                    <button onclick="viewer.setView('side')">侧视图</button>
                    <button onclick="viewer.setView('front')">前视图</button>
                    <button onclick="viewer.setView('free')">自由视角</button>
                </div>
                <div class="info">鼠标: 左键旋转 | 右键平移 | 滚轮缩放</div>
            </div>

            <div class="section">
                <div class="section-title">📊 数据统计</div>
                <div id="stats">
                    <div>请加载数据集...</div>
                </div>
            </div>

            <div class="section" style="flex: 1; min-height: 0;">
                <div class="section-title">🎬 帧列表</div>
                <div id="frameList">
                    <div class="info" style="padding: 15px; text-align: center;">等待加载...</div>
                </div>
            </div>

            <div class="section" style="flex: 1; min-height: 0;">
                <div class="section-title">🎨 语义类别</div>
                <div class="legend" id="legend"></div>
            </div>
        </div>

        <div id="viewer">
            <div id="loading">正在初始化...</div>
        </div>
    </div>

    <!-- Three.js 和依赖库 -->
    <!-- Import Map 用于解决模块依赖 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

    <!-- 使用 ES Module 加载 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 将 Module Namespace Object 转换为普通对象，以便扩展
        window.THREE = { ...THREE };
        window.THREE.OrbitControls = OrbitControls;

        // 动态加载 viewer.js
        const script = document.createElement('script');
        script.src = 'viewer.js';
        script.onload = () => {
            console.log('✓ Viewer.js loaded successfully');
        };
        script.onerror = () => {
            document.getElementById('loading').textContent = '❌ 加载失败: viewer.js';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
